@keyframes rabbitGlow{0%,100%{filter:drop-shadow(0 0 16px rgba(155,77,255,.55)) drop-shadow(0 0 2px rgba(255,255,255,.25));}50%{filter:drop-shadow(0 0 34px rgba(239,70,214,.8)) drop-shadow(0 0 6px rgba(255,255,255,.45));}}
@keyframes ctaPulse{0%,100%{box-shadow:0 0 16px rgba(239,70,214,.45);}50%{box-shadow:0 0 32px rgba(155,77,255,.75);}}
.nic{position:relative;}
.nic .ring{position:relative;transition:transform .25s;}
.nic:hover .ring{transform:scale(1.08);}
.nic .badge{position:absolute;bottom:-3px;inset-inline-end:-3px;width:20px;height:20px;border-radius:50%;background:#0c0724;border:1.5px solid var(--c,var(--teal));display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.ring-group{width:54px;height:54px;position:relative;}
.mini-rabbit{position:absolute;width:32px;height:32px;border-radius:50%;background-image:var(--rabbit-img);background-size:cover;background-position:center;border:2px solid var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .35s;}
.mini-rabbit.r1{top:0;inset-inline-start:11px;z-index:3;}
.mini-rabbit.r2{top:16px;inset-inline-start:0;z-index:2;}
.mini-rabbit.r3{top:16px;inset-inline-start:22px;z-index:1;}
.nic:hover .mini-rabbit.r2{transform:translate(-7px,5px);}
.nic:hover .mini-rabbit.r3{transform:translate(7px,5px);}
.signup-cta{display:flex;align-items:center;gap:8px;padding:12px 22px;border-radius:30px;border:none;background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 0 22px rgba(239,70,214,.5);animation:ctaPulse 2.4s ease-in-out infinite;}
.signup-cta .sc-ic{font-size:16px;}
.cta-flash{animation:ctaPulse .45s ease-in-out 3 !important;}
.onb-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:4px;scroll-snap-type:x mandatory;}
.onb-card{flex:0 0 auto;scroll-snap-align:start;width:68px;background:linear-gradient(160deg,rgba(155,77,255,.18),rgba(38,208,240,.10));border:1px solid var(--stroke);border-radius:12px;padding:8px 4px;text-align:center;}
.onb-ic{font-size:18px;margin-bottom:4px;}
.onb-card span{font-size:8px;color:var(--muted);}
:root{
  --bg:#050311;--card:#150c33;--card2:#1a1140;--stroke:#3a2a72;--text:#f3f1fb;--muted:#a79bd1;
  --teal:#2ad8c9;--violet:#9b4dff;--pink:#ef46d6;--cyan:#26d0f0;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:
  radial-gradient(ellipse at 10% 0%,rgba(123,47,247,.35),transparent 45%),
  radial-gradient(ellipse at 90% 10%,rgba(38,208,240,.15),transparent 40%),
  #05030f;color:var(--text);padding-bottom:40px;}
.wrap{max-width:min(1900px,97vw);margin:0 auto;padding:clamp(10px,2vw,28px);}
/* header banner */
.banner{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:22px;padding:clamp(26px,4.5vw,54px) clamp(14px,3vw,32px);border-bottom:1px solid var(--stroke);margin-bottom:30px;}
.banner::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
 background:
  radial-gradient(1.6px 1.6px at 12% 22%,#fff 99%,transparent),
  radial-gradient(1.2px 1.2px at 28% 68%,#fff 99%,transparent),
  radial-gradient(1.8px 1.8px at 42% 12%,#fff 99%,transparent),
  radial-gradient(1.2px 1.2px at 58% 78%,#fff 99%,transparent),
  radial-gradient(1.6px 1.6px at 70% 34%,#fff 99%,transparent),
  radial-gradient(1.2px 1.2px at 85% 60%,#fff 99%,transparent),
  radial-gradient(1.8px 1.8px at 93% 15%,#fff 99%,transparent),
  radial-gradient(1.2px 1.2px at 8% 85%,#fff 99%,transparent),
  radial-gradient(1.4px 1.4px at 50% 45%,#fff 99%,transparent),
  radial-gradient(circle at 88% 25%,rgba(155,77,255,.4),transparent 46%),
  radial-gradient(circle at 10% 75%,rgba(38,208,240,.25),transparent 42%),
  radial-gradient(circle at 55% 90%,rgba(239,70,214,.2),transparent 40%);
 animation:starTwinkle 5s ease-in-out infinite;}
.banner>*{position:relative;z-index:1;}
@keyframes starTwinkle{0%,100%{opacity:.75;}50%{opacity:1;}}
.brand{display:flex;align-items:center;gap:12px;}
.rabbit{border-radius:50%;background:conic-gradient(from 210deg,var(--violet),var(--cyan),var(--pink),var(--violet));display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(155,77,255,.55);flex-shrink:0;background-image:var(--rabbit-img);background-size:cover;background-position:center;background-repeat:no-repeat;}
.brand .rabbit{width:clamp(84px,9vw,132px);height:clamp(84px,9vw,132px);font-size:32px;animation:rabbitGlow 3.2s ease-in-out infinite;}
.logo-fixed{font-weight:800;background:linear-gradient(90deg,#fff,#d8c8ff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15;}
.brand .logo-fixed{font-size:clamp(26px,3.2vw,44px);text-shadow:0 0 20px rgba(155,77,255,.6);}
.brand .hit{color:var(--pink);-webkit-text-fill-color:var(--pink);}
.brand .tag{color:var(--muted);font-size:12px;margin-top:2px;}
.nav-icons{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.nic{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:88px;}
.nic .ring{width:54px;height:54px;border-radius:50%;border:2px solid var(--c,var(--teal));display:flex;align-items:center;justify-content:center;font-size:22px;background-color:rgba(255,255,255,.03);background-image:var(--rabbit-img);background-size:cover;background-position:center;background-repeat:no-repeat;}
.nic b{font-size:12px;}
.nic span{font-size:10px;color:var(--muted);text-align:center;}
.headline{text-align:end;}
.headline h1{font-size:17px;margin:0;}
.headline .logo-fixed{font-size:14px;}
/* lang toggle */
#langBtn{position:fixed;top:16px;inset-inline-end:16px;z-index:80;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--stroke);color:var(--text);font-size:19px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5);}
/* frames grid */
.row{display:flex;gap:clamp(10px,1.6vw,24px);flex-wrap:wrap;justify-content:center;margin-bottom:clamp(18px,3vw,36px);}
.fcol{display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(210px,21vw,290px);}
.frame{width:clamp(210px,21vw,290px);aspect-ratio:9/18;background:linear-gradient(180deg,var(--card),#0c0724);border:1px solid var(--stroke);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .5s;}
.frame.ring{box-shadow:0 0 0 3px var(--cyan),0 0 30px var(--cyan);}
.cap{font-size:12px;color:var(--muted);}
.fh{display:flex;align-items:center;justify-content:space-between;padding:10px 10px;border-bottom:1px solid var(--stroke);}
.fh .rabbit{width:24px;height:24px;font-size:12px;}
.fh .logo-fixed{font-size:11px;}
.fh .ic{width:26px;height:26px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}
.status{display:flex;justify-content:space-between;padding:6px 12px;font-size:11px;color:var(--muted);}
.fb{flex:1;overflow-y:auto;padding:10px;font-size:12px;}
.btn{border:none;border-radius:12px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;width:100%;}
.btn-p{background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;}
.btn-o{background:transparent;border:1px solid var(--stroke);color:var(--text);}
/* welcome */
.w-center{text-align:center;padding:18px 14px;}
.w-center .rabbit{width:80px;height:80px;font-size:36px;margin:6px auto 10px;}
.w-center .logo-fixed{font-size:18px;}
.w-center .tag{font-size:10px;color:var(--muted);margin:6px 0 14px;}
.w-center .btn{margin-bottom:8px;}
.soc{display:flex;justify-content:center;gap:8px;margin-top:10px;}
.soc div{width:28px;height:28px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;}
.skip{color:var(--muted);font-size:10px;margin-top:10px;cursor:pointer;}
/* home */
.stories{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;}
.story{flex-shrink:0;text-align:center;font-size:9px;color:var(--muted);}
.story .av{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--pink),var(--violet),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;margin-bottom:3px;}
.post{background:var(--card2);border-radius:12px;padding:8px;margin-bottom:10px;}
.prow{display:flex;gap:6px;align-items:center;}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.pmeta b{font-size:11px;display:block;}
.pmeta span{font-size:9px;color:var(--muted);}
.pimg{margin-top:6px;height:70px;border-radius:8px;background:linear-gradient(135deg,#2a1663,#3a6df0);}
.pact{display:flex;gap:10px;margin-top:6px;font-size:10px;color:var(--muted);}

.reel .rabbit{width:90px;height:90px;font-size:42px;}
.rside{position:absolute;inset-inline-end:8px;bottom:70px;display:flex;flex-direction:column;gap:10px;align-items:center;font-size:9px;}
.rside div{background:rgba(0,0,0,.4);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;}
.rcap{position:absolute;bottom:0;padding:10px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);width:100%;font-size:10px;}
.rtabs{display:flex;gap:10px;font-size:10px;color:var(--muted);}
.rtabs b{color:var(--text);}
/* video */
.vtabs{display:flex;gap:6px;margin-bottom:8px;font-size:9px;flex-wrap:wrap;}
.vtabs span{padding:3px 8px;border-radius:12px;border:1px solid var(--stroke);color:var(--muted);}
.vtabs span.on{background:var(--violet);color:#fff;border-color:transparent;}
.vfeat{border-radius:10px;overflow:hidden;background:var(--card2);}
.vfeat .pimg{height:70px;margin:0;border-radius:0;}
.vfeat .vt{padding:6px 8px;}
.vgrid{display:flex;gap:6px;margin-top:8px;}
.vgrid div{flex:1;height:36px;border-radius:6px;background:linear-gradient(135deg,#2a1663,#26d0f0);}
/* games */
.gbanner{background:linear-gradient(90deg,var(--violet),var(--pink));border-radius:10px;padding:8px;margin-bottom:8px;font-size:10px;}
.chips{display:flex;gap:6px;margin-bottom:8px;font-size:9px;flex-wrap:wrap;}
.chips span{padding:3px 8px;border-radius:10px;background:var(--card2);color:var(--muted);}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.gcard{background:var(--card2);border-radius:8px;padding:6px;text-align:center;}
.gcard .pimg{height:34px;margin:0 0 4px;}
.gcard b{font-size:9px;display:block;}
.gcard button{margin-top:4px;width:100%;font-size:8px;padding:4px;border:none;border-radius:6px;background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;cursor:pointer;}
/* chat */
.bubble{max-width:75%;padding:6px 9px;border-radius:10px;margin-bottom:6px;font-size:10px;}
.bubble.in{background:var(--card2);}
.bubble.out{background:linear-gradient(90deg,var(--violet),var(--pink));margin-inline-start:auto;color:#fff;}
.ctime{font-size:8px;color:var(--muted);margin-bottom:8px;}
.cinput{display:flex;gap:4px;padding:6px;border-top:1px solid var(--stroke);}
.cinput input{flex:1;background:var(--card2);border:1px solid var(--stroke);border-radius:14px;padding:5px 8px;color:var(--text);font-size:10px;}
/* profile */
.pf-head{text-align:center;padding-top:6px;}
.pf-head .av{width:56px;height:56px;font-size:18px;margin:0 auto 6px;}
.pf-head .logo-fixed{font-size:12px;}
.pstats{display:flex;justify-content:center;gap:14px;margin:8px 0;}
.pstats div{text-align:center;}
.pstats b{display:block;font-size:12px;}
.pstats span{font-size:8px;color:var(--muted);}
.ptabs{display:flex;justify-content:space-around;font-size:9px;color:var(--muted);border-top:1px solid var(--stroke);border-bottom:1px solid var(--stroke);padding:6px 0;margin:8px 0;}
/* create */
textarea{width:100%;background:var(--card2);border:1px solid var(--stroke);border-radius:8px;color:var(--text);font-size:11px;padding:8px;min-height:44px;resize:none;}
.copts{display:flex;gap:6px;margin:8px 0;justify-content:space-between;}
.copts div{flex:1;text-align:center;font-size:8px;background:var(--card2);border-radius:6px;padding:5px 2px;}
.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.cgrid div{height:30px;border-radius:6px;background:linear-gradient(135deg,#2a1663,#3a6df0);}
/* notif */
.ntabs{display:flex;gap:6px;margin-bottom:8px;font-size:9px;flex-wrap:wrap;}
.ntabs span{padding:3px 8px;border-radius:12px;border:1px solid var(--stroke);color:var(--muted);}
.ntabs span.on{background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;border-color:transparent;}
.nitem{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--stroke);}
.nitem .meta{font-size:10px;}
.nitem .meta span{display:block;font-size:8px;color:var(--muted);}
/* footer */
.footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 10px;border-top:1px solid var(--stroke);margin-top:20px;}
.flinks{display:flex;gap:16px;font-size:12px;color:var(--muted);}
.stores{display:flex;gap:8px;}
.store{background:var(--card2);border:1px solid var(--stroke);border-radius:8px;padding:6px 12px;font-size:10px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--violet);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none;}
.toast.show{opacity:1;}
@media(max-width:600px){.headline{text-align:center;width:100%;}}
@media(max-width:680px){

.fnav{position:relative;display:flex;justify-content:space-around;align-items:flex-end;margin:0 8px 8px;padding:14px 4px 8px;}
.fnav::before{content:'';position:absolute;inset:0;z-index:0;border-radius:26px;background:linear-gradient(135deg,rgba(155,77,255,.22),rgba(38,208,240,.12));border:1px solid var(--stroke);-webkit-mask:radial-gradient(circle 28px at 50% 21px,transparent 27px,#000 28px);mask:radial-gradient(circle 28px at 50% 21px,transparent 27px,#000 28px);}
.fnav .ni{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--muted);transition:color .2s;}
.fnav .ni svg{width:28px;height:28px;opacity:.7;transition:opacity .2s,filter .2s;overflow:visible;}
.fnav .ni .lb{font-size:8px;line-height:1;white-space:nowrap;}
.fnav .ni:hover svg{opacity:1;animation:hop .55s ease;}
.fnav .ni.on{color:var(--gl,var(--cyan));}
.fnav .ni.on svg{opacity:1;filter:drop-shadow(0 0 6px var(--gl,var(--cyan)));}
.fnav .ni.on::after{content:'';position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--gl,var(--cyan));box-shadow:0 0 6px var(--gl,var(--cyan)),9px -3px 0 0 var(--gl,var(--cyan));margin-inline-end:9px;}

.fnav .orb{position:relative;width:42px;height:42px;border-radius:50%;background-image:var(--rabbit-img);background-size:cover;background-position:center;border:2px solid #0c0724;box-shadow:0 0 0 2px var(--pink),0 0 18px var(--pink);animation:rabbitGlow 3.2s ease-in-out infinite;}

.space .orbm{position:absolute;inset:-34%;border-radius:50%;animation:spin 8s linear infinite;}
.space .orbm i{position:absolute;left:50%;top:0;width:calc(8px*var(--k));height:calc(8px*var(--k));margin-left:calc(-4px*var(--k));border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#aab4cc 60%,#5a6480);box-shadow:0 0 6px rgba(255,255,255,.6);}
.space .sm{top:calc(var(--y)*1px*var(--k));width:calc(var(--d)*1px*var(--k));height:calc(var(--d)*1px*var(--k));left:calc(var(--x) - var(--d)*.5px*var(--k));}
.space .e1{background:radial-gradient(ellipse at 60% 55%,rgba(60,200,90,.75) 0 22%,transparent 25%),radial-gradient(circle at 32% 28%,#bff5ff,#2a8bff 45%,#0a3a7a 100%);box-shadow:inset -3px -3px 6px rgba(0,0,0,.55),0 0 10px rgba(80,170,255,.6);}
.space .e2{background:radial-gradient(circle at 32% 28%,#ffffff,#b8c4dc 55%,#5a6480 100%);box-shadow:inset -3px -3px 5px rgba(0,0,0,.5),0 0 8px rgba(200,220,255,.45);}
@media(prefers-reduced-motion:reduce){.space .aur,.space .st,.space .spark,.space .sun,.space .sun::before,.space .orbm{animation:none}}

.flinks{align-items:center;flex-wrap:wrap;}
.flinks .fl{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:6px 4px;position:relative;transition:color .2s;}
.flinks .fl::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--pink));transform:scaleX(0);transition:transform .25s;}
.flinks .fl:hover,.flinks .fl:focus-visible{color:var(--text);outline:none;}
.flinks .fl:hover::after,.flinks .fl:focus-visible::after{transform:scaleX(1);}
.store{color:var(--text);font-family:inherit;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;}
.store:hover,.store:focus-visible{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 6px 18px rgba(38,208,240,.28);outline:none;}
#pageOv{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;overflow-y:auto;background:radial-gradient(ellipse at 50% 0%,rgba(155,77,255,.3),transparent 60%),#06030f;}
#pageOv.open{display:flex;animation:ovIn .3s ease;}
@keyframes ovIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ov-head{display:flex;align-items:center;gap:14px;padding:16px clamp(16px,4vw,32px);padding-inline-end:76px;border-bottom:1px solid var(--stroke);}
.ov-back{background:var(--card);border:1px solid var(--stroke);color:var(--text);border-radius:20px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer;transition:border-color .2s;}
.ov-back:hover{border-color:var(--cyan);}
.ov-body{max-width:640px;width:100%;margin:0 auto;padding:clamp(24px,6vw,56px) 20px;text-align:center;}
.ov-body .rabbit{width:96px;height:96px;margin:0 auto 18px;animation:rabbitGlow 3.2s ease-in-out infinite;}
.ov-body h2{font-size:clamp(22px,4vw,32px);margin:0 0 10px;}
.ov-body p{color:var(--muted);line-height:1.9;margin:0;}
.ov-badge{display:inline-block;padding:4px 14px;border-radius:20px;background:linear-gradient(90deg,var(--violet),var(--pink));font-size:11px;font-weight:700;margin-bottom:14px;}
.ov-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0;}
.ov-chips span{padding:10px 16px;border:1px dashed var(--stroke);border-radius:14px;background:var(--card);font-size:13px;}
.ov-body .btn{max-width:260px;margin-top:8px;}

#langBtn{position:static;z-index:auto;width:auto;height:auto;min-height:42px;padding:8px 16px;border-radius:26px;display:flex;align-items:center;gap:8px;flex-shrink:0;font-family:inherit;font-size:13px;font-weight:700;background:rgba(20,12,50,.75);border:1px solid var(--cyan);box-shadow:0 0 14px rgba(38,208,240,.35);transition:box-shadow .2s,transform .2s;}
#langBtn:hover,#langBtn:focus-visible{transform:translateY(-2px);box-shadow:0 0 22px rgba(38,208,240,.65);outline:none;}
#langBtn .lg-ic{font-size:18px;line-height:1;}
#langBtn.swap{animation:langSwap .4s ease;}
@keyframes langSwap{from{opacity:.2;transform:translateX(var(--sw,14px))}to{opacity:1;transform:none}}
.ov-head{padding-inline-end:clamp(16px,4vw,32px);}
.ov-lang{margin-inline-start:auto;}
@media(max-width:680px){#langBtn{padding:0;width:40px;height:40px;min-height:0;justify-content:center;}#langBtn .lg-tx{display:none;}}
@media(prefers-reduced-motion:reduce){#langBtn.swap{animation:none}}

/* brand wordmark: identical order and spacing in every language, no overlap */
.wordmark{direction:ltr;unicode-bidi:isolate;line-height:1.12;gap:.05em .4em;justify-content:center;}
.wordmark span{transform:none;white-space:nowrap;}
.wordmark .wm1{letter-spacing:.2em;margin-right:-.2em;}
.wordmark .wm2{letter-spacing:.16em;margin-right:-.16em;}
/* back-to-top arrow */
#toTop{position:fixed;bottom:20px;inset-inline-start:20px;z-index:60;width:46px;height:46px;border-radius:50%;border:1px solid var(--cyan);background:rgba(20,12,50,.85);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 16px rgba(38,208,240,.4);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .25s,transform .25s,box-shadow .2s;}
#toTop.show{opacity:1;pointer-events:auto;transform:none;}
#toTop:hover,#toTop:focus-visible{box-shadow:0 0 26px rgba(38,208,240,.75);outline:none;}
#toTop svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.ov-back{font-weight:700;}

/* ============ phone: compact hero (v0.7 — tighter gaps, nothing hidden) ============ */

 .ring-group{width:40px;height:40px;}
 .mini-rabbit{width:24px;height:24px;}
 .mini-rabbit.r1{top:0;inset-inline-start:8px;}

 .headline{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:start;}

 .signup-cta{margin-top:0;padding:7px 12px;font-size:11px;gap:6px;}

 .row{margin-bottom:14px;}
}

  document.getElementById('profileGrid').innerHTML='<div></div><div></div><div></div>';
  document.getElementById('notifTabs').innerHTML=notifTabs.map((t,i)=>`<span class="${i===3?'on':''}">${t[lang]}</span>`).join('');
  document.getElementById('notifList').innerHTML=notifs.map(n=>`<div class="nitem"><div class="av">${n.av}</div><div class="meta">${n.n[lang]}<span>${tr(n.t)}</span></div></div>`).join('');
}
const NAV_ICONS={
 home:'<i class="hg"></i>',
 discover:'<svg viewBox="0 0 32 32"><ellipse cx="11" cy="13" rx="3.4" ry="9" transform="rotate(-14 11 13)" fill="url(#gDisc)"/><ellipse cx="21" cy="13" rx="3.4" ry="9" transform="rotate(14 21 13)" fill="url(#gDisc)"/><ellipse cx="11" cy="13.5" rx="1.3" ry="6" transform="rotate(-14 11 13.5)" fill="#ffd6f4" opacity=".85"/><ellipse cx="21" cy="13.5" rx="1.3" ry="6" transform="rotate(14 21 13.5)" fill="#ffd6f4" opacity=".85"/><circle cx="16" cy="26" r="4.8" fill="url(#gDisc)"/><path d="M4 12Q1.8 8 4 4M1.5 14Q-1.5 8 1.5 2M28 12Q30.2 8 28 4M30.5 14Q33.5 8 30.5 2" fill="none" stroke="url(#gDisc)" stroke-width="1.6" stroke-linecap="round"/></svg>',
 messages:'<svg viewBox="0 0 32 32"><path d="M13 6.5C11 3 12 1.5 13.5 2.5M16 6C16 2 17.5 .8 18 2.5M19 6.5C21 3.5 23 3 23 4.5" stroke="#2ad8c9" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M6 10a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4c0 3-1.6 5-3 7.5L17.4 29c-.7 1.4-2.1 1.4-2.8 0L9 17.5C7.6 15 6 13 6 10z" fill="url(#gMsg)"/><path d="M11 11h10M12.5 15h7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".9"/></svg>',
 profile:'<svg viewBox="0 0 32 32"><path d="M16 28c-5 0-7.5-3.2-6-6 1.4-2.6 3.6-4.5 6-4.5s4.6 1.9 6 4.5c1.5 2.8-1 6-6 6z" fill="url(#gProf)"/><ellipse cx="7.5" cy="15.5" rx="2.4" ry="3.2" transform="rotate(-22 7.5 15.5)" fill="url(#gProf)"/><ellipse cx="12.6" cy="10" rx="2.5" ry="3.5" transform="rotate(-8 12.6 10)" fill="url(#gProf)"/><ellipse cx="19.4" cy="10" rx="2.5" ry="3.5" transform="rotate(8 19.4 10)" fill="url(#gProf)"/><ellipse cx="24.5" cy="15.5" rx="2.4" ry="3.2" transform="rotate(22 24.5 15.5)" fill="url(#gProf)"/></svg>'
};
const NAV_GLOW={home:'#2ad8c9',discover:'#c25bff',messages:'#26d0f0',profile:'#ff7ac8'};
const NAV_ITEMS=[['home','f-home','b_home'],['discover','f-video','b_discover'],['create','f-create','b_create'],['messages','f-messages','b_messages'],['profile','f-profile','b_profile']];
function buildNav(){
  document.querySelectorAll('.fnav').forEach(n=>{
    const act=n.dataset.active;
    n.innerHTML=NAV_ITEMS.map(([k,t,l])=>k==='create'
      ?`<div class="ni plus" onclick="focusFrame('${t}')"><span class="orb"><b>+</b></span><span class="lb" data-i18n="${l}"></span></div>`
      :`<div class="ni ${act===k?'on':''}" style="--gl:${NAV_GLOW[k]}" onclick="focusFrame('${t}')">${NAV_ICONS[k]}<span class="lb" data-i18n="${l}"></span></div>`
    ).join('');
  });
}
const PAGES={
 contact:{title:{ar:'تواصل معنا',en:'Contact us'},text:{ar:'نجهّز واجهة للتواصل مع فريق المنصة، وسنبنيها في المرحلة القادمة.',en:'We are preparing a way to reach the platform team. It will be built in the next phase.'},items:[{ar:'نموذج مراسلة',en:'Contact form'},{ar:'الدعم والمساعدة',en:'Help & support'},{ar:'حساباتنا الرسمية',en:'Official accounts'}]},
 share:{title:{ar:'شارك المنصة',en:'Share the platform'},text:{ar:'واجهة مشاركة المنصة مع الأصدقاء ستُبنى لاحقاً.',en:'The interface for sharing the platform with friends will be built later.'},items:[{ar:'مشاركة برابط',en:'Share by link'},{ar:'وسائل التواصل الاجتماعي',en:'Social networks'},{ar:'رمز QR',en:'QR code'}]},
 privacy:{title:{ar:'سياسة الخصوصية والاستخدام',en:'Privacy & Terms of Use'},text:{ar:'سيُضاف النص الرسمي للسياسة وشروط الاستخدام قبل الإطلاق.',en:'The official policy and terms text will be added before launch.'},items:[{ar:'سياسة الخصوصية',en:'Privacy policy'},{ar:'شروط الاستخدام',en:'Terms of use'},{ar:'سياسة المحتوى',en:'Content policy'}]},
 gplay:{title:{ar:'قريباً على Google Play',en:'Coming soon to Google Play'},text:{ar:'التطبيق قيد التطوير. سجّل الآن لتكون من أوائل من يعرف عند الإطلاق.',en:'The app is under development. Sign up now to be among the first to know at launch.'},cta:true},
 astore:{title:{ar:'قريباً على App Store',en:'Coming soon to the App Store'},text:{ar:'التطبيق قيد التطوير. سجّل الآن لتكون من أوائل من يعرف عند الإطلاق.',en:'The app is under development. Sign up now to be among the first to know at launch.'},cta:true}
};
let openKey=null;
function openPage(k){openKey=k;renderPage();document.getElementById('pageOv').classList.add('open');document.body.style.overflow='hidden';}
function closePage(toTopFlag){openKey=null;document.getElementById('pageOv').classList.remove('open');document.body.style.overflow='';if(toTopFlag===true)toTop();}
function toTop(){window.scrollTo({top:0,behavior:'smooth'});}
window.addEventListener('scroll',()=>{document.getElementById('toTop').classList.toggle('show',window.scrollY>400);},{passive:true});
function renderPage(){
  if(!openKey)return;
  const p=PAGES[openKey];
  document.getElementById('ovBack').textContent=(lang==='ar'?'→ ':'← ')+(lang==='ar'?'رجوع':'Back');
  document.getElementById('ovTitle').textContent=p.title[lang];
  document.getElementById('ovBody').innerHTML=
    '<div class="rabbit"></div><span class="ov-badge">'+(lang==='ar'?'قيد الإنشاء':'Coming soon')+'</span>'+
    '<h2>'+p.title[lang]+'</h2><p>'+p.text[lang]+'</p>'+
    (p.items?'<div class="ov-chips">'+p.items.map(i=>'<span>'+i[lang]+'</span>').join('')+'</div>':'')+
    (p.cta?'<div class="ov-chips"></div><button class="btn btn-p" onclick="closePage();openSignup()">'+tr('signup_cta')+'</button>':'');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePage();});
function toggleLang(){
  lang=lang==='ar'?'en':'ar';render();renderPage();
  const b=document.getElementById('langBtn');
  b.style.setProperty('--sw',lang==='en'?'-18px':'18px');
  b.classList.remove('swap');void b.offsetWidth;b.classList.add('swap');
}
function openSignup(){
  focusFrame('f-welcome');
  const btns=document.querySelectorAll('#f-welcome .btn');
  btns.forEach(b=>b.classList.add('cta-flash'));
  setTimeout(()=>btns.forEach(b=>b.classList.remove('cta-flash')),1400);
}
function focusFrame(id){
  const el=document.getElementById(id);
  el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
  el.classList.add('ring');
  setTimeout(()=>el.classList.remove('ring'),1000);
}
function showToast(key){
  const el=document.getElementById('toast');
  el.textContent=tr(key);el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1500);
}
function publishPost(){
  document.getElementById('postText').value='';
  showToast('published');
  focusFrame('f-home');
}
buildNav();
render();
</script>
</body>
</html>
